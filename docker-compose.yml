services:
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      VITE_API_BASE: http://aggredata.localhost
    ports:
      - "5173:5173"
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aggredata_front.rule=Host(`aggredata.localhost`)"
      - "traefik.http.routers.aggredata_front.entrypoints=web"
      - "traefik.http.routers.aggredata_front.priority=1"
      - "traefik.http.services.aggredata_front.loadbalancer.server.port=5173"
    develop:
      watch:
        - action: sync+restart
          path: ./frontend
          target: /frontend
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/Dockerfile

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  torproxy:
    image: dperson/torproxy:latest
    ports:
      - "9050:9050"

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    ports:
      - "8000:8000"
    volumes:
      - raw_data:/app/data/raw
    command: sh -c "python -m app.cli db-upgrade && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aggredata_api.rule=Host(`aggredata.localhost`) && PathPrefix(`/api`)"
      - "traefik.http.routers.aggredata_api.entrypoints=web"
      - "traefik.http.routers.aggredata_api.priority=100"
      - "traefik.http.services.aggredata_api.loadbalancer.server.port=8000"
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  scheduler:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-scheduler --loop"
    volumes:
      - raw_data:/app/data/raw
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  worker-telegram:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-worker --concurrency 4 --queues telegram_live,telegram_backfill"
    volumes:
      - raw_data:/app/data/raw
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  worker-darknet:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-worker --concurrency ${WORKER_DARKNET_CONCURRENCY:-16} --queues darknet"
    volumes:
      - raw_data:/app/data/raw
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  telegram-listener:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-telegram-listener"
    volumes:
      - raw_data:/app/data/raw
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  whatsapp-bridge:
    build: ./whatsapp-bridge
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL_PG: postgresql://postgres:postgres@db:5432/aggregator
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: raw-events
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: miniosecret
      MEDIA_MAX_BYTES: 52428800
    depends_on:
      - nats
      - db
      - minio
    volumes:
      - wa_sessions:/sessions
    restart: unless-stopped

  whatsapp-listener:
    build: .
    env_file:
      - .env
    depends_on:
      - nats
      - db
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-whatsapp-listener"
    volumes:
      - raw_data:/app/data/raw
    restart: unless-stopped

volumes:
  pgdata:
  nats_data:
  minio_data:
  raw_data:
  wa_sessions:
