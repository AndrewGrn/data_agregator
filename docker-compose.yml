services:
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=DEBUG"
    ports:
      - "${HTTP_PORT:-80}:80"
      # dashboard: loopback only, it exposes the whole routing table
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      # Empty = same-origin. Set only to point the SPA at a different API host.
      VITE_API_BASE: "${VITE_API_BASE:-}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aggredata_front.rule=${TRAEFIK_FRONT_RULE:-PathPrefix(`/`)}"
      - "traefik.http.routers.aggredata_front.entrypoints=web"
      - "traefik.http.routers.aggredata_front.priority=1"
      - "traefik.http.services.aggredata_front.loadbalancer.server.port=5173"
    develop:
      watch:
        - action: sync+restart
          path: ./frontend
          target: /frontend
          ignore:
            - node_modules/
            - dist/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/Dockerfile

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-aggregator}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"  # HTTP only; native 9000 would collide with MinIO
    volumes:
      - chdata:/var/lib/clickhouse

  nats:
    image: nats:2.10-alpine
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data

  torproxy:
    image: dperson/torproxy:latest
    ports:
      - "127.0.0.1:${TOR_PORT:-9050}:9050"

  minio:
    # MinIO no longer publishes to Docker Hub — docker.io/minio/minio returns
    # "pull access denied" even with a valid token. quay.io is their registry.
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - raw_data:/app/data/raw
    command: sh -c "python -m app.cli db-upgrade && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.aggredata_api.rule=${TRAEFIK_API_RULE:-PathPrefix(`/api`)}"
      - "traefik.http.routers.aggredata_api.entrypoints=web"
      - "traefik.http.routers.aggredata_api.priority=100"
      - "traefik.http.services.aggredata_api.loadbalancer.server.port=8000"
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  scheduler:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-scheduler --loop"
    volumes:
      - raw_data:/app/data/raw
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  worker-telegram:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-worker --concurrency 4 --queues telegram_live,telegram_backfill"
    volumes:
      - raw_data:/app/data/raw
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  worker-darknet:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-worker --concurrency ${WORKER_DARKNET_CONCURRENCY:-16} --queues darknet"
    volumes:
      - raw_data:/app/data/raw
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  worker-whatsapp:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-worker --concurrency ${WORKER_WHATSAPP_CONCURRENCY:-2} --queues whatsapp"
    volumes:
      - raw_data:/app/data/raw
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  telegram-listener:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - nats
      - torproxy
      - minio
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-telegram-listener"
    volumes:
      - raw_data:/app/data/raw
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - data_aggregator.db
            - .env
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile

  whatsapp-bridge:
    build: ./whatsapp-bridge
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL_PG: postgresql://postgres:postgres@db:5432/aggregator
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: raw-events
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: miniosecret
      MEDIA_MAX_BYTES: 52428800
    depends_on:
      - nats
      - db
      - minio
    volumes:
      - wa_sessions:/sessions
    restart: unless-stopped

  whatsapp-listener:
    build: .
    env_file:
      - .env
    depends_on:
      - nats
      - db
    command: sh -c "python -m app.cli db-upgrade && python -m app.cli run-whatsapp-listener"
    volumes:
      - raw_data:/app/data/raw
    restart: unless-stopped

volumes:
  pgdata:
  chdata:
  nats_data:
  minio_data:
  raw_data:
  wa_sessions:
